name: story_app
description: "StoryFun — AI 短剧 + Web3 平台 Flutter 客户端，参考 story.fun。"
publish_to: "none"
version: 1.3.1+117

environment:
  sdk: "^3.12.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ─── 状态管理 / 路由 / DI / HTTP ──────────────────────────
  http: ^1.6.0
  alice: ^1.0.0
  alice_http: ^1.0.7
  flutter_riverpod: ^3.3.2
  centrifuge: ^0.20.0

  # ─── 序列化 / 比较 ────────────────────────────────────────
  equatable: ^2.0.5
  json_annotation: ^4.12.0
  meta: ^1.16.0

  # ─── 精确十进制算术（与 web 端 decimal.js 行为对齐）─────────
  decimal: ^3.0.2
  crypto: ^3.0.6

  # ─── 本地存储 ──────────────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ─── 网络连接检测 ──────────────────────────────────────────
  connectivity_plus: ^7.3.1

  # ─── UI / 资源 ─────────────────────────────────────────────
  cached_network_image: ^3.4.1
  easy_refresh: ^3.5.1
  flutter_cache_manager: ^3.4.1
  flutter_svg: ^2.0.10
  emoji_picker_flutter: ^4.5.3
  intl: ^0.20.2

  # ─── Privy 鉴权（邮箱 OTP + Solana 钱包）────────────────────
  privy_flutter: ^0.10.0

  # ─── Solana SDK（构建 sponsor 代付提现交易 + ATA 派生）─────
  solana: ^0.32.0+1
  bs58: ^1.0.2

  # ─── 视频播放（HLS）────────────────────────────────────────
  better_native_video_player: ^1.5.2
  flutter_secure_storage: ^10.3.1

  # ─── 内购（消耗型 Consumable IAP）────────────────────────────
  in_app_purchase: ^3.3.0
  # 直接使用平台扩展 API（queryPastPurchases / refreshPurchaseVerificationData）。
  in_app_purchase_android: ^0.5.2
  in_app_purchase_storekit: ^0.4.11

  # ─── 启动画面 / 启动图 ───────────────────────────────────────────────
  flutter_native_splash: ^2.4.8

  # ─── 图标 / 图片选择 ───────────────────────────────────────────────
  image_picker: ^1.2.3
  # 直接配置 AndroidX Photo Picker；旧设备会自动回退 ACTION_OPEN_DOCUMENT。
  image_picker_android: ^0.8.13+19
  image_picker_platform_interface: ^2.11.1

  # ─── 视频文件多选 ───────────────────────────────────────────────────
  file_picker: ^12.0.0

  # ─── 本地视频元数据（时长等）─────────────────────────────────────
  flutter_video_info: ^1.0.4

  # ─── 视频缩略图生成 ─────────────────────────────────────────────
  fc_native_video_thumbnail: ^0.16.1
  path_provider: ^2.1.5

  # ─── 图片裁剪 ───────────────────────────────────────────────────────
  crop_your_image: ^2.0.0
  image: ^4.8.0
  qr_flutter: ^4.1.0

  # ─── 二维码扫描 ──────────────────────────────────────────────────────
  qr_code_scanner_plus: ^2.2.0

  # ─── 应用版本信息 ───────────────────────────────────────────────────
  package_info_plus: ^10.2.1

  # ─── 系统浏览器打开 URL ─────────────────────────────────────────────
  url_launcher: ^6.3.1
  share_plus: 13.1.0
  webview_flutter: ^4.14.1

  # ─── 列表项侧滑操作项 ───────────────────────────────────────────────
  flutter_slidable: ^3.1.1

dependency_overrides:
  # Local fork adds native first-frame/frame-heartbeat events used by the
  # feed's frozen-surface watchdog.
  better_native_video_player:
    path: packages/better_native_video_player-1.5.2
  # Alice 1.0.0 still declares share_plus ^11; its API usage is compatible
  # with the project's share_plus 13 line.
  share_plus: 13.1.0
  # Alice 1.0.0 still declares package_info_plus ^8; its API usage is
  # compatible with the project's package_info_plus 10 line.
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  path_provider_platform_interface: ^2.1.3
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/tabbar/
    - assets/images/
    - assets/login/
    - assets/wallet/
    - assets/drama/
    - assets/game/
    - assets/game_v2/
    - assets/game_v3/
    - assets/drawer/
    - assets/common/
    - assets/badge/
    - assets/iap/
    - assets/publish_video/
    - assets/follow/
    - assets/watch_history/
