name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify codegen is up-to-date
        run: |
          dart run build_runner build
          flutter gen-l10n
          if ! git diff --exit-code --quiet lib/; then
            echo "::error::Codegen output is not committed. Run 'dart run build_runner build' and 'flutter gen-l10n', then commit."
            git diff --stat lib/
            exit 1
          fi

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
